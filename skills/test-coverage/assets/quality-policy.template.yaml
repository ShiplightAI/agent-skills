name: "<Project quality policy name>"
summary: "<How this project wants test-coverage to spend proof budget and why>"

contexts:
  - id: "local"
    description: "<Developer-local proof context>"
  - id: "pr-ci"
    description: "<Pull request CI gate>"
  - id: "staging-gate"
    description: "<Pre-release staging gate>"

defaults:
  preferred_modalities: ["unit", "contract", "integration"]
  discouraged_modalities: ["manual"]
  required_modalities: []
  required_contexts: []
  require_multi_layer: false
  require_gate: false
  notes: "<Default proof posture when no narrower rule applies>"

# Rules key on the declared `priority` (a governed fact), not on an authored
# risk weight. P0 = the release-critical floor.
rules:
  - id: "p0-floor"
    when:
      priorities: ["P0"]
    preferred_modalities: ["integration", "e2e", "agent"]
    required_contexts: ["pr-ci"]
    require_multi_layer: true
    require_gate: true
    notes: "<Every P0 expectation needs multi-layer proof and at least one gate in CI>"

  - id: "data-integrity"
    when:
      categories: ["data", "billing", "auth"]
    preferred_modalities: ["contract", "integration"]
    require_multi_layer: true
    notes: "<State-changing and boundary-sensitive checks should favor contract/integration proof>"

modality_guidance:
  - modality: "unit"
    use_for:
      - "deterministic logic"
      - "edge cases"
    avoid_for:
      - "browser-rendered workflows"
      - "third-party callbacks"
    notes: "<Cheap and narrow; maximize on core and changed logic>"

  - modality: "agent"
    use_for:
      - "live-environment behavior"
      - "cross-layer investigation"
    avoid_for:
      - "logic that cheaper deterministic proof can cover"
    notes: "<Reserve for high-value behavior and live checks>"

guardrails:
  - "Capability before cost."
  - "Priority sets a floor; budget only flexes the ceiling."
  - "Use defense-in-depth on the highest-priority (P0) checks."

floors:
  - "Unit coverage on core and changed logic."
  - "At least one gate on every P0 check."
